<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WorkloadIQ – Workforce Productivity Agent</title>
<style>
:root{--bg:#f3f5fb;--sf:#fff;--s2:#eef1f9;--tx:#151a2e;--mt:#5c657f;--bd:#dce1ef;--ac:#4f46e5;--ok:#10b981;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1c;--sf:#141933;--s2:#1b2142;--tx:#e8ebfa;--mt:#98a1c4;--bd:#272e57;--ac:#8083ff}}
:root[data-theme="dark"]{--bg:#0b0e1c;--sf:#141933;--s2:#1b2142;--tx:#e8ebfa;--mt:#98a1c4;--bd:#272e57;--ac:#8083ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#ef4444 55%,#6366f1);display:inline-block}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav button,.btn{border:0;background:none;color:var(--mt);font:600 13px Inter,system-ui,sans-serif;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff}nav button:not(.on):hover{background:var(--s2)}.btn{background:var(--s2);color:var(--tx)}
main{max-width:1180px;margin:0 auto;padding:20px}.g{display:grid;gap:14px}.g6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 10px;font-size:14px}.mt{color:var(--mt)}.sm{font-size:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}.kpi span{color:var(--mt);font-size:12px}.kpi em{font-style:normal;font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row .l{width:120px;font-size:12px;flex:none}.bar{flex:1;height:12px;background:var(--s2);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;border-radius:7px}.row .v{width:56px;text-align:right;font-size:12px;font-weight:600;flex:none}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.tag{display:inline-block;padding:2px 9px;border-radius:20px;background:var(--s2);font-size:11px;font-weight:600;margin:2px 3px 2px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mt);font-weight:600}
.ins{padding:10px 12px;border-left:3px solid var(--ac);background:var(--s2);border-radius:0 9px 9px 0;margin:8px 0;font-size:13px}
input[type=range]{width:100%;accent-color:var(--ac)}.sc{overflow-x:auto}svg text{fill:var(--mt);font-size:10px}
.chat{height:430px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.m{max-width:90%;padding:10px 13px;border-radius:13px;font-size:13px}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.b{background:var(--s2)}
.step{font:11.5px ui-monospace,Menlo,monospace;color:var(--mt);margin:2px 0}.step b{color:var(--ok)}
.chips button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 11px;border-radius:20px;font:12px Inter,system-ui,sans-serif;cursor:pointer;margin:3px 3px 0 0}.chips button:hover{border-color:var(--ac)}
.in{display:flex;gap:8px;margin-top:10px}.in input{flex:1;padding:10px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit}.in button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
.big{font-size:28px;font-weight:800}.up{color:var(--ok)}.dn{color:var(--bad)}
.hero{background:linear-gradient(120deg,#4338ca,#be185d 70%,#f59e0b);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px}.hero p{margin:4px 0 0;opacity:.92;max-width:780px}
</style></head><body>
<header><div class="logo"><i></i>WorkloadIQ</div>
<nav id="nav"><button data-t="ov" class="on">Overview</button><button data-t="wk">Workload impact</button><button data-t="bn">Bottlenecks</button><button data-t="lab">Intervention lab</button><button data-t="ag">AI agent</button></nav>
<button class="btn" id="th">◐ Theme</button></header>
<main><div class="hero"><h2>Workforce Productivity and Workload Agent</h2><p>Analyses 220 employees across 8 teams (hours, overtime, absence, task completion, engagement, performance), finds where work is piling up, and simulates the workload interventions that recover output without burning people out.</p></div>
<section id="ov"></section><section id="wk" hidden></section><section id="bn" hidden></section><section id="lab" hidden></section><section id="ag" hidden></section></main>
<script>
const $=i=>document.getElementById(i),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>sum(a)/(a.length||1),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const fm=n=>n>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Math.round(n).toLocaleString('en-IN');
let s=7;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;const nrm=()=>{let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*rnd())};
const eff=h=>Math.max(.4,1-.028*Math.max(0,h-42)),bur=(ot,eng,ab)=>cl(100*(.45*ot/15+.3*(10-eng)/6+.25*ab/12),0,100);
const DP=[['Engineering',38,46,1.08],['QA & Testing',22,53,1.35],['Customer Support',40,51,1.28],['Sales',30,44,1],['Finance Ops',20,49,1.2],['HR',14,41,.9],['Marketing',26,43,.95],['Logistics',30,47,1.1]];
const DC=['#6366f1','#ef4444','#f59e0b','#14b8a6','#ec4899','#0ea5e9','#8b5cf6','#84cc16'];
const E=[];DP.forEach((d,di)=>{for(let i=0;i<d[1];i++){const h=cl(d[2]+nrm()*3,36,64),ot=Math.max(0,h-40),as=40*d[3]*(1+nrm()*.08),sk=1+nrm()*.08,dn=Math.min(h*eff(h)*sk,as),eng=cl(8.4-.17*(h-40)+nrm()*.7,1,10),ab=cl(3+.4*ot+nrm()*1.2,0,30);
E.push({id:'E'+(2000+E.length),di,dept:d[0],h,ot,as,dn,sk,comp:dn/as,oph:eff(h)*sk,eng,ab,perf:cl(3.4+(dn/as-.85)*2+(eng-7)*.1+nrm()*.4,1,5),bo:bur(ot,eng,ab)})}});
const D=DP.map((d,i)=>{const m=E.filter(e=>e.di==i),a=f=>avg(m.map(e=>e[f]));return{i,name:d[0],n:m.length,h:a('h'),ot:a('ot'),ab:a('ab'),eng:a('eng'),perf:a('perf'),bo:a('bo'),oph:a('oph'),as:sum(m.map(e=>e.as)),dn:sum(m.map(e=>e.dn)),comp:sum(m.map(e=>e.dn))/sum(m.map(e=>e.as)),back:sum(m.map(e=>e.as-e.dn))}});
const mx=f=>Math.max(...D.map(f));D.forEach(d=>d.score=100*(.3*(1-d.comp)/mx(x=>1-x.comp)+.2*d.ot/mx(x=>x.ot)+.2*d.back/mx(x=>x.back)+.15*d.ab/mx(x=>x.ab)+.15*(10-d.eng)/mx(x=>10-x.eng)));
const RK=[...D].sort((a,b)=>b.score-a.score);
const pr=(a,b)=>{const ma=avg(a),mb=avg(b);return sum(a.map((v,i)=>(v-ma)*(b[i]-mb)))/Math.sqrt(sum(a.map(v=>(v-ma)**2))*sum(b.map(v=>(v-mb)**2)))};
const COR=[['Hours vs output per hour',pr(E.map(e=>e.h),E.map(e=>e.oph))],['Hours vs engagement',pr(E.map(e=>e.h),E.map(e=>e.eng))],['Overtime vs absenteeism',pr(E.map(e=>e.ot),E.map(e=>e.ab))],['Engagement vs performance',pr(E.map(e=>e.eng),E.map(e=>e.perf))],['Hours vs task completion',pr(E.map(e=>e.h),E.map(e=>e.comp))]];
const MO=['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
const TS=MO.map((_,m)=>{const o=(11-m)*.4,hs=E.map(e=>Math.max(36,e.h-o)),out=sum(E.map((e,i)=>hs[i]*eff(hs[i])*e.sk));return{h:avg(hs),oh:out/sum(hs),out}});
const idx=k=>TS.map(t=>t[k]/TS[0][k]*100);
const BIN={};E.forEach(e=>{const b=Math.floor(e.h/2)*2;(BIN[b]=BIN[b]||[]).push(e.dn)});
const BL=Object.entries(BIN).filter(b=>b[1].length>=5).map(([b,v])=>[+b,avg(v),v.length]).sort((a,b)=>a[0]-b[0]);const SW=BL.reduce((a,b)=>b[1]>a[1]?b:a);
const ORG={h:avg(E.map(e=>e.h)),ot:avg(E.map(e=>e.ot)),ab:avg(E.map(e=>e.ab)),eng:avg(E.map(e=>e.eng)),comp:sum(D.map(d=>d.dn))/sum(D.map(d=>d.as)),hi:E.filter(e=>e.bo>55).length};
const BO=[...E].sort((a,b)=>b.bo-a.bo);
const recs=d=>{const r=[];if(d.comp<.85)r.push(`Clear backlog of ${Math.round(d.back)} tasks/wk: add about ${Math.ceil(d.back/38)} FTE or defer low-priority work`);if(d.ot>7)r.push(`Cap overtime at 5 hrs/wk (now ${d.ot.toFixed(1)})`);if(d.eng<6.8)r.push('Run a workload-reset sprint and engagement pulse survey');if(d.ab>7)r.push('Rotate on-call duty and add recovery days to cut absence');if(d.comp>=.97&&d.ot<3)r.push('Has slack: absorb overflow tasks from bottleneck teams');return r.length?r:['Healthy: monitor monthly']};
// ---- simulator ----
const DEF={cap:20,hires:0,reb:0,auto:0};
function sim(P){const don=RK.slice(0,3).map(d=>d.i),rec=RK.slice(-3).map(d=>d.i),tb=sum(D.map(d=>d.back)),R=D.map(d=>d.as*(1-P.auto/100*.6));let mv=0;don.forEach(i=>{const m=R[i]*P.reb/100;R[i]-=m;mv+=m});const rh=sum(rec.map(i=>D[i].n));rec.forEach(i=>R[i]+=mv*D[i].n/rh);
return D.map((d,i)=>{const hc=d.n+P.hires*d.back/tb,q=(R[i]/hc)/(d.as/d.n),o0=Math.max(0,d.h-40),ot=d.h<40?0:Math.min(P.cap,o0*q*q),h=d.h<40?d.h:40+ot,out=hc*h*eff(h),dn=Math.min(out,R[i]),eng=cl(8.4-.17*(h-40),1,10),ab=cl(3+.4*ot,0,30),bo=bur(ot,eng,ab);return{i,hc,h,ot,R:R[i],dn,comp:dn/R[i],eng,ab,bo,hi:hc*cl((bo-35)/40,0,1),oph:eff(h)}})}
const summ=(r,P)=>{const H=sum(r.map(x=>x.hc));return{comp:sum(r.map(x=>x.dn))/sum(r.map(x=>x.R))*100,h:sum(r.map(x=>x.hc*x.h))/H,ot:sum(r.map(x=>x.hc*x.ot)),ab:sum(r.map(x=>x.hc*x.ab))/H,hi:sum(r.map(x=>x.hi)),oph:sum(r.map(x=>x.hc*x.h*x.oph))/sum(r.map(x=>x.hc*x.h))*100,cost:P.hires*85000,hc:H}};
function opt(){let b,bs=-1e9;[5,8,10,20].forEach(cap=>[0,10,20,30,40].forEach(hires=>[0,10,20,30].forEach(reb=>[0,10,20].forEach(auto=>{const P={cap,hires,reb,auto},m=summ(sim(P),P),sc=m.comp-m.hi*.12-hires*.15-auto*.05;if(sc>bs){bs=sc;b=P}}))));return b}
// ---- charts ----
function line(S,L,W=620,H=250){const all=S.flatMap(s=>s.v),mn=Math.min(...all)-2,mxv=Math.max(...all)+2,x=i=>40+i*(W-60)/(L.length-1),y=v=>H-30-(v-mn)/(mxv-mn)*(H-50);
return`<svg viewBox="0 0 ${W} ${H}" width="100%">`+[0,1,2,3].map(k=>{const v=mn+(mxv-mn)*k/3;return`<line x1="40" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="34" y="${y(v)+3}" text-anchor="end">${v.toFixed(0)}</text>`}).join('')+L.map((l,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${l}</text>`).join('')+S.map(q=>`<polyline fill="none" stroke="${q.c}" stroke-width="2.5" points="${q.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(L.length-1)}" cy="${y(q.v[q.v.length-1])}" r="4" fill="${q.c}"/>`).join('')+'</svg>'}
const bars=(rows,max,f)=>rows.map(([l,v,c])=>`<div class="row"><div class="l">${l}</div><div class="bar"><i style="width:${Math.max(2,Math.abs(v)/max*100)}%;background:${c||'var(--ac)'}"></i></div><div class="v">${f(v)}</div></div>`).join('');
const dd=(a,b)=>{const v=((b-a)/a*100);return(v>=0?'+':'')+v.toFixed(0)+'%'};
// ---- views ----
function ovw(){const h1=TS[11].h/TS[0].h-1,p1=TS[11].oh/TS[0].oh-1,o1=TS[11].out/TS[0].out-1;
$('ov').innerHTML=`<div class="g g6">${[['Avg weekly hours',ORG.h.toFixed(1),dd(TS[0].h,TS[11].h)+' vs Nov','dn'],['Output per hour',(eff(ORG.h)*100).toFixed(0)+'%',dd(TS[0].oh,TS[11].oh)+' vs Nov','dn'],['Task completion',(ORG.comp*100).toFixed(0)+'%','backlog '+Math.round(sum(D.map(d=>d.back)))+' tasks/wk','dn'],['Overtime / person',ORG.ot.toFixed(1)+' h','per week','dn'],['Absence days / yr',ORG.ab.toFixed(1),'per employee','dn'],['High burnout risk',ORG.hi,'of 220 employees','dn']].map(k=>`<div class="c kpi"><span>${k[0]}</span><b>${k[1]}</b><em class="${k[3]}">${k[2]}</em></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Hours up, productivity down (index, Nov = 100)</h3>${line([{c:'#ef4444',v:idx('h')},{c:'#4f46e5',v:idx('oh')},{c:'#14b8a6',v:idx('out')}],MO)}<div>${[['#ef4444','Hours worked'],['#4f46e5','Output per hour'],['#14b8a6','Total output']].map(a=>`<span class="tag"><span class="dot" style="background:${a[0]}"></span>${a[1]}</span>`).join('')}</div></div>
<div class="c"><h3>AI headline insights</h3><div class="ins"><b>Hours rose ${(h1*100).toFixed(0)}% but total output moved only ${(o1*100).toFixed(1)}%.</b> Output per hour fell ${(-p1*100).toFixed(0)}%: fatigue is eating the extra time.</div><div class="ins"><b>${RK[0].name}, ${RK[1].name} and ${RK[2].name}</b> are the top bottlenecks, completing just ${(RK[0].comp*100).toFixed(0)}–${(RK[2].comp*100).toFixed(0)}% of assigned work.</div><div class="ins"><b>Output peaks near ${SW[0]}–${SW[0]+2} hrs/week.</b> Beyond that each added hour yields less than the one before.</div><div class="ins"><b>${E.filter(e=>e.h>48).length} employees work over 48 hrs</b> and show the lowest engagement and highest absence.</div></div></div>
<div class="c" style="margin-top:14px"><h3>Highest burnout risk employees</h3><div class="sc"><table><tr><th>ID</th><th>Team</th><th>Hours</th><th>Absence</th><th>Engagement</th><th>Completion</th><th>Risk</th></tr>${BO.slice(0,6).map(e=>`<tr><td>${e.id}</td><td>${e.dept}</td><td>${e.h.toFixed(0)}</td><td>${e.ab.toFixed(0)}d</td><td>${e.eng.toFixed(1)}</td><td>${(e.comp*100).toFixed(0)}%</td><td><b class="dn">${e.bo.toFixed(0)}</b></td></tr>`).join('')}</table></div></div>`}
function wkm(){const X=h=>40+(h-36)/28*560,Y=v=>270-(v-.4)/.8*250,bm=Math.max(...BL.map(b=>b[1]));
$('wk').innerHTML=`<div class="g g2"><div class="c"><h3>Hours worked vs effective output per hour</h3><div class="sc"><svg viewBox="0 0 620 300" width="100%" style="min-width:440px"><line x1="40" y1="270" x2="600" y2="270" stroke="var(--bd)"/><line x1="40" y1="20" x2="40" y2="270" stroke="var(--bd)"/>${[40,45,50,55,60].map(h=>`<text x="${X(h)}" y="288" text-anchor="middle">${h}h</text>`).join('')}<line x1="${X(SW[0])}" x2="${X(SW[0])}" y1="20" y2="270" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${X(SW[0])+4}" y="30" style="fill:var(--ok)">sweet spot</text>${E.map(e=>`<circle cx="${X(e.h)}" cy="${Y(e.oph)}" r="3" fill="${DC[e.di]}" opacity=".6"/>`).join('')}</svg></div><div class="sm mt">Each dot is an employee, coloured by team. Fatigue sets in after ~42 hrs/week.</div></div>
<div class="c"><h3>Average tasks completed per week, by hours band</h3><div class="sc"><svg viewBox="0 0 620 300" width="100%" style="min-width:440px">${BL.map((b,i)=>{const w=560/BL.length,hh=b[1]/bm*220;return`<rect x="${42+i*w}" y="${255-hh}" width="${w-6}" height="${hh}" rx="4" fill="${b[0]==SW[0]?'#10b981':'var(--ac)'}" opacity="${b[0]==SW[0]?1:.5}"/><text x="${42+i*w+(w-6)/2}" y="272" text-anchor="middle">${b[0]}–${b[0]+2}</text><text x="${42+i*w+(w-6)/2}" y="${249-hh}" text-anchor="middle">${b[1].toFixed(0)}</text>`}).join('')}</svg></div><div class="ins"><b>Diminishing returns:</b> the ${SW[0]}–${SW[0]+2} hr band completes the most work (${SW[1].toFixed(0)} tasks). Staff in the 52+ bands finish fewer tasks than colleagues working 10 fewer hours.</div></div></div>
<div class="c" style="margin-top:14px"><h3>Key relationships (Pearson r)</h3>${bars(COR.map(c=>[c[0],c[1],c[1]<0?'#ef4444':'#4f46e5']),1,v=>v.toFixed(2))}<div class="sm mt">Longer hours go with lower output per hour and engagement, while overtime tracks closely with absenteeism. Engagement and performance move together.</div></div>`}
const hc_=(v,min,max,inv)=>{let t=(v-min)/(max-min||1);if(inv)t=1-t;return`background:rgba(239,68,68,${(.08+t*.5).toFixed(2)})`};
function bnm(){const C=[['Hours','h',0],['Overtime','ot',0],['Absence','ab',0],['Completion','comp',1],['Engagement','eng',1],['Burnout','bo',0],['Score','score',0]];
$('bn').innerHTML=`<div class="c"><h2>Bottleneck detector</h2><div class="mt sm">Score = 30% completion gap + 20% overtime + 20% unfinished backlog + 15% absence + 15% low engagement (each scaled to the worst team). Darker red means worse.</div><div class="sc" style="margin-top:10px"><table><tr><th>Team</th>${C.map(c=>`<th>${c[0]}</th>`).join('')}<th>Backlog</th></tr>${RK.map(d=>`<tr><td><span class="dot" style="background:${DC[d.i]}"></span><b>${d.name}</b></td>${C.map(c=>{const v=d[c[1]],mn=Math.min(...D.map(x=>x[c[1]])),mxx=Math.max(...D.map(x=>x[c[1]]));return`<td style="${hc_(v,mn,mxx,c[2])}">${c[1]=='comp'?(v*100).toFixed(0)+'%':v.toFixed(1)}</td>`}).join('')}<td>${Math.round(d.back)}/wk</td></tr>`).join('')}</table></div></div>
<div class="g g2" style="margin-top:14px">${RK.slice(0,4).map((d,k)=>`<div class="c"><h3><span class="tag" style="background:#ef4444;color:#fff">#${k+1}</span>${d.name}: score ${d.score.toFixed(0)}</h3><div class="sm mt">${d.n} people · ${d.h.toFixed(1)} hrs · ${(d.comp*100).toFixed(0)}% completion · ${d.ot.toFixed(1)}h overtime</div>${recs(d).map(r=>`<div class="ins">${r}</div>`).join('')}</div>`).join('')}</div>`}
let P={...DEF};
function labm(){const sl=(k,t,mn,mxx,f)=>`<div style="margin:12px 0"><b>${t}: <span id="v_${k}">${f(P[k])}</span></b><input type="range" data-k="${k}" min="${mn}" max="${mxx}" value="${P[k]}"></div>`;
$('lab').innerHTML=`<div class="g g2" style="grid-template-columns:1fr 2fr"><div class="c"><h2>Intervention lab</h2><div class="mt sm">Adjust levers and see the effect on every team instantly.</div>${sl('cap','Overtime cap (hrs/wk)',0,20,v=>v==20?'no cap':v)}${sl('hires','New hires (to backlog-heavy teams)',0,40,v=>v)}${sl('reb','Rebalance work from top 3 bottlenecks (%)',0,40,v=>v+'%')}${sl('auto','Automate routine tasks (%)',0,30,v=>v+'%')}<button class="btn" id="ao">✨ AI optimal plan</button> <button class="btn" id="rs">Reset</button></div><div class="c" id="res"></div></div>`;
document.querySelectorAll('#lab input').forEach(e=>e.oninput=()=>{P[e.dataset.k]=+e.value;$('v_'+e.dataset.k).textContent=e.dataset.k=='cap'&&P.cap==20?'no cap':e.dataset.k=='reb'||e.dataset.k=='auto'?P[e.dataset.k]+'%':P[e.dataset.k];res()});
$('ao').onclick=()=>{P=opt();labm()};$('rs').onclick=()=>{P={...DEF};labm()};res()}
function res(){const b0=sim(DEF),a0=sim(P),B=summ(b0,DEF),A=summ(a0,P);
const k=[['Task completion',B.comp,A.comp,v=>v.toFixed(0)+'%',1],['Output per hour (index)',B.oph,A.oph,v=>v.toFixed(0),1],['Avg weekly hours',B.h,A.h,v=>v.toFixed(1),0],['Overtime hrs / week',B.ot,A.ot,v=>Math.round(v),0],['High-burnout headcount',B.hi,A.hi,v=>Math.round(v),0],['Absence days / yr',B.ab,A.ab,v=>v.toFixed(1),0]];
$('res').innerHTML=`<div class="g g6" style="grid-template-columns:repeat(3,1fr)">${k.map(([t,b,a,f,g])=>{const d=a-b,good=g?d>=0:d<=0,ch=Math.abs(d)<.01*Math.abs(b);return`<div class="kpi"><span>${t}</span><b>${f(a)}</b><em class="${ch?'mt':good?'up':'dn'}">${f(b)} → ${f(a)}</em></div>`}).join('')}</div><div class="ins">Cost of new hires: <b>${fm(A.cost)}/month</b> (assumed ₹85k per hire). Total headcount ${A.hc.toFixed(0)}.</div>
<div class="sc"><table><tr><th>Team</th><th>Hours</th><th>Completion</th><th>Burnout risk</th><th>Headcount</th></tr>${D.map((d,i)=>`<tr><td><span class="dot" style="background:${DC[i]}"></span>${d.name}</td><td>${b0[i].h.toFixed(1)} → <b>${a0[i].h.toFixed(1)}</b></td><td>${(b0[i].comp*100).toFixed(0)}% → <b>${(a0[i].comp*100).toFixed(0)}%</b></td><td>${b0[i].bo.toFixed(0)} → <b>${a0[i].bo.toFixed(0)}</b></td><td>${b0[i].hc.toFixed(0)} → <b>${a0[i].hc.toFixed(0)}</b></td></tr>`).join('')}</table></div>`}
// ---- agent ----
const CH=['Give me an executive summary','Where are the bottlenecks?','Who is at risk of burnout?','Why is productivity falling?','What if we cap overtime at 5 and hire 20?','Recommend an intervention plan'];
function agm(){$('ag').innerHTML=`<div class="g g2" style="grid-template-columns:2fr 1fr"><div class="c"><h3>🤖 Workforce Intelligence Agent</h3><div class="chat" id="chat"><div class="m b">Hi! I’ve analysed 220 employees across 8 teams. Ask about bottlenecks, burnout, overtime, what-if scenarios (e.g. “hire 15 and automate 10”) or a specific team.</div></div><div class="in"><input id="q" placeholder="Ask about a team, risk, scenario or recommendation…"><button id="go">Send</button></div></div>
<div class="c"><h3>Try asking</h3><div class="chips">${CH.map(c=>`<button onclick="ask(this.textContent)">${c}</button>`).join('')}</div><h3 style="margin-top:16px">Agent pipeline</h3><div class="sm mt">1. Ingest HR, workload and task data<br>2. Clean, merge, build features<br>3. Model hours vs output curve<br>4. Score team bottlenecks<br>5. Flag burnout risk<br>6. Simulate interventions<br>7. Recommend the best plan</div></div></div>`;
$('go').onclick=()=>{const v=$('q').value.trim();if(v){$('q').value='';ask(v)}};$('q').onkeydown=e=>{if(e.key=='Enter')$('go').click()}}
const num=(q,re,d)=>{const m=q.match(re);return m?+m[1]:d};
function reply(q){let st,h;const dep=D.find(d=>q.toLowerCase().includes(d.name.toLowerCase().split(' ')[0]));
if(/what.?if|simulat|cap|hire|automat|rebalanc/i.test(q)&&/\d/.test(q)){const p={cap:num(q,/cap\D*(\d+)/i,20),hires:num(q,/hir\w*\D*(\d+)/i,0),reb:num(q,/rebalanc\w*\D*(\d+)/i,0),auto:num(q,/automat\w*\D*(\d+)/i,0)},B=summ(sim(DEF),DEF),A=summ(sim(p),p);st=['Parsing scenario levers','Re-solving team workloads','Comparing with baseline'];
h=`<b>Scenario:</b> OT cap ${p.cap==20?'none':p.cap+'h'}, ${p.hires} hires, ${p.reb}% rebalance, ${p.auto}% automation<table><tr><th>Metric</th><th>Now</th><th>Scenario</th></tr><tr><td>Task completion</td><td>${B.comp.toFixed(0)}%</td><td><b>${A.comp.toFixed(0)}%</b></td></tr><tr><td>Avg hours</td><td>${B.h.toFixed(1)}</td><td><b>${A.h.toFixed(1)}</b></td></tr><tr><td>High-burnout staff</td><td>${B.hi.toFixed(0)}</td><td><b>${A.hi.toFixed(0)}</b></td></tr><tr><td>Hiring cost</td><td>–</td><td>${fm(A.cost)}/mo</td></tr></table>${A.comp<B.comp?'Completion drops because capping hours removes capacity that nothing replaces. Pair a cap with hires or automation.':'Net positive: more work completes with fewer hours.'}`}
else if(/bottleneck|slow|stuck|worst|where/i.test(q)){st=['Scoring all 8 teams','Ranking by composite score'];h=`<b>Top bottlenecks</b><table><tr><th>Team</th><th>Score</th><th>Completion</th><th>Backlog</th></tr>${RK.slice(0,3).map(d=>`<tr><td>${d.name}</td><td><b>${d.score.toFixed(0)}</b></td><td>${(d.comp*100).toFixed(0)}%</td><td>${Math.round(d.back)}/wk</td></tr>`).join('')}</table>Root cause: demand per head is about ${(RK[0].as/RK[0].n/40*100-100).toFixed(0)}% above capacity in ${RK[0].name}, so people stretch to ${RK[0].h.toFixed(0)}h and lose efficiency.`}
else if(/burnout|risk|who|employee|attrition/i.test(q)){st=['Scoring burnout (overtime, engagement, absence)','Ranking employees'];h=`<b>${ORG.hi} employees</b> are above the high-risk threshold. Top 5:<table><tr><th>ID</th><th>Team</th><th>Hrs</th><th>Eng.</th><th>Risk</th></tr>${BO.slice(0,5).map(e=>`<tr><td>${e.id}</td><td>${e.dept}</td><td>${e.h.toFixed(0)}</td><td>${e.eng.toFixed(1)}</td><td><b>${e.bo.toFixed(0)}</b></td></tr>`).join('')}</table>Suggest manager check-ins this week and a temporary workload cut.`}
else if(/recommend|interven|fix|plan|best|optimal plan/i.test(q)){const p=opt(),A=summ(sim(p),p),B=summ(sim(DEF),DEF);st=['Searching 240 intervention combinations','Maximising completion minus burnout and cost'];h=`<b>Best plan found:</b> overtime cap ${p.cap==20?'none':p.cap+'h'}, ${p.hires} hires, move ${p.reb}% of work from the top 3 bottlenecks, automate ${p.auto}%.<br>Completion ${B.comp.toFixed(0)}% → <b>${A.comp.toFixed(0)}%</b>, avg hours ${B.h.toFixed(1)} → <b>${A.h.toFixed(1)}</b>, high-burnout ${B.hi.toFixed(0)} → <b>${A.hi.toFixed(0)}</b>, cost ${fm(A.cost)}/mo.<br>Priority teams: ${RK.slice(0,3).map(d=>d.name).join(', ')}. Load it in the Intervention lab with “AI optimal plan”.`}
else if(dep){st=['Loading '+dep.name+' metrics'];h=`<b>${dep.name}</b>: ${dep.n} people, ${dep.h.toFixed(1)} hrs/wk, ${(dep.comp*100).toFixed(0)}% completion, engagement ${dep.eng.toFixed(1)}, absence ${dep.ab.toFixed(1)}d. Bottleneck score ${dep.score.toFixed(0)} (rank ${RK.indexOf(dep)+1} of 8).<br>${recs(dep).map(r=>'• '+r).join('<br>')}`}
else if(/engage/i.test(q)){st=['Correlating engagement drivers'];h=`Engagement drops ${(-COR[1][1]).toFixed(2)} in correlation with hours: lowest in ${[...D].sort((a,b)=>a.eng-b.eng)[0].name} (${[...D].sort((a,b)=>a.eng-b.eng)[0].eng.toFixed(1)}/10). It also tracks performance (r = ${COR[3][1].toFixed(2)}), so workload relief should lift output indirectly.`}
else if(/why|productiv|sweet|hours|overtime|correl|decline|fall/i.test(q)){st=['Modelling hours vs output','Finding the sweet spot'];h=`Output per hour fell <b>${(-(TS[11].oh/TS[0].oh-1)*100).toFixed(0)}%</b> while hours rose <b>${((TS[11].h/TS[0].h-1)*100).toFixed(0)}%</b>. Weekly output peaks at ${SW[0]}–${SW[0]+2} hrs; beyond ~42 hrs fatigue cuts efficiency by roughly 3% per extra hour.<br>Overtime and absence correlate at r = ${COR[2][1].toFixed(2)}, so more hours are now creating lost days.`}
else if(/summar|overview|exec|report|insight/i.test(q)){st=['Scanning all metrics','Ranking issues'];h=`<b>Executive summary</b><br>• Hours +${((TS[11].h/TS[0].h-1)*100).toFixed(0)}% in 12 months; output per hour ${((TS[11].oh/TS[0].oh-1)*100).toFixed(0)}%.<br>• Bottlenecks: ${RK.slice(0,3).map(d=>d.name).join(', ')}.<br>• ${ORG.hi} staff at high burnout risk.<br>• Teams like HR, Marketing and Sales have slack to absorb work.<br>• Fix: cap overtime, rebalance, targeted hires, automation.`}
else{st=['Parsing intent'];h='I can cover bottlenecks, burnout risk, why productivity is falling, a specific team, what-if scenarios (e.g. “hire 15 and cap overtime at 6”) and a recommended plan.'}
return{st,h}}
function ask(q){document.querySelector('[data-t=ag]').click();const c=$('chat'),u=document.createElement('div');u.className='m u';u.textContent=q;c.appendChild(u);const b=document.createElement('div');b.className='m b';c.appendChild(b);const r=reply(q);let i=0;
const nx=()=>{if(i<r.st.length){b.innerHTML+=`<div class="step"><b>✓</b> ${r.st[i++]}…</div>`;c.scrollTop=1e5;setTimeout(nx,420)}else{b.innerHTML+=`<div style="margin-top:6px">${r.h}</div>`;c.scrollTop=1e5}};b.innerHTML='<div class="step">⚙ Agent thinking…</div>';setTimeout(()=>{b.innerHTML='';nx()},300)}
const V={ov:ovw,wk:wkm,bn:bnm,lab:labm,ag:agm};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x==b));Object.keys(V).forEach(k=>$(k).hidden=k!=b.dataset.t);if(b.dataset.t!='ag'||!$('chat'))V[b.dataset.t]()});
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
ovw();
</script></body></html>
